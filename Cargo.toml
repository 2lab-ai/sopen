[package]
name = "sopen"
version = "0.1.0"
edition = "2021"
# The floor the GUI stack (eframe) needs; the Linux gate builds with exactly this toolchain.
rust-version = "1.95"
license = "MIT"
description = "Open a file or folder on another machine as if it were local (scp syntax, system ssh, SFTP)"
repository = "https://github.com/2lab-ai/sopen"

[features]
default = ["stems"]
# `sopen stems` (spec §7a): voice / music separation in this process through sherpa-onnx's C API,
# statically linked (ONNX Runtime included). build.rs downloads the pinned prebuilt archive for
# the target and checks its SHA-256 (`SHERPA_ONNX_LIB_DIR` = an already extracted `lib/` for
# offline builds). Without it `sopen stems` says this build cannot separate.
stems = []

[lib]
name = "sopen"
path = "src/lib.rs"

[[bin]]
name = "sopen"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
# Buffers handed to SFTP reads (openssh-sftp-client takes `bytes::BytesMut`).
bytes = "1.11.0"
clap = { version = "4.6.7", features = ["derive", "string"] }
# Cache dir per platform (spec §5: `<cache>/<host>/<abs path>`).
directories = "6.0.0"
# Transport = the system `ssh` binary (spec §4); process-mux (default) attaches to our own ControlMaster.
openssh = "0.11.6"
openssh-sftp-client = { version = "0.15.12", features = ["openssh"] }
# `ReadDir` is a `futures_core::Stream` (directory listing over SFTP).
futures-core = "0.3.31"
# ffprobe output and the usage log are JSON.
serde_json = "1.0.150"
# Content hash (did the editor change the file?) and the host hash in the usage log.
sha2 = "0.10.9"
# The image and media windows (spec §6, §7): wgpu renderer by default, glow as the fallback.
eframe = { version = "0.37.0", features = ["glow"] }
# Image window: decode, crop/pixelize, re-encode in the source format (spec §6).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
# The image window's picture of a PNG still arriving (06 §7.3): rows as they come, through the
# row reader `image` does not expose. Already in the tree (`image`'s own PNG codec), at the same
# version.
png = "0.18.1"
# Generic pixel arithmetic for pixelize over 8-bit, 16-bit and float images.
num-traits = "0.2.19"
# In-window playback: audio out (the master clock) fed from ffmpeg through a lock-free ring.
cpal = "0.18.2"
rtrb = "0.4.1"
# `O_NOFOLLOW` / `O_NONBLOCK`: chmod a cache entry through its own descriptor, never a path.
libc = "0.2.191"
# openssh / openssh-sftp-client are async; sopen drives them from a current-thread runtime
# (`sync`: a stream's transport thread takes its requests through a tokio channel; the SFTP
# client already turns the feature on).
tokio = { version = "1.54.1", features = ["rt", "time", "sync"] }
# The config file (`target = "<host>"`, spec §4a) is TOML; a key sopen does not know is an error.
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
# Is `--target HOST` this machine? (spec §4a) — HOST is compared with this machine's host name.
gethostname = "1.1.0"
# Pasted text in the image window (spec §1 message 12): the installed font with Hangul is found
# by the provider eframe already puts in every window (same version, no new crates), and the
# text is rasterised with ab_glyph (pure Rust; already in the Linux build through winit).
egui_system_font_provider = "0.37.0"
ab_glyph = "0.2.32"
# …composed to NFC first: Korean copied from a macOS file name comes as decomposed jamo. Already
# in the tree (eframe → webbrowser → url → idna), with the same single feature.
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
# Binary files (spec §6a): the "Save to…" Browse button opens the platform's save dialog — the
# native panel on macOS, xdg-desktop-portal over D-Bus on Linux (libdbus is loaded at runtime;
# no GTK, nothing new linked).
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
# The file browser's text viewer: Sublime syntaxes, with the pure-Rust regex engine
# (fancy-regex), not oniguruma — nothing linked (on Linux the binary loads glibc, libasound and,
# for `stems`, libstdc++ and nothing else). No HTML output, plist or YAML loaders: only the
# bundled syntax dump is read; the theme is the skin's own, built in code
# (`gui::chrome::syntax_theme`).
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# The text viewer's word wrap breaks rows only between grapheme clusters (an Indic syllable, a
# letter and its marks, an emoji sequence stay whole). Already in the tree (eframe → epaint), at
# the same version.
unicode-segmentation = "1.13.3"

[build-dependencies]
# build.rs checks the downloaded sherpa-onnx archive against its pinned SHA-256.
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"
# Highlighting's tests run the grammars' patterns on the engine syntect runs them on, with its
# backtrack limit set low: what a search costs, counted in steps. Already in the tree (syntect →
# fancy-regex), at the same version and features; nothing new is linked into sopen.
fancy-regex = "0.16.2"
# Tests run OpenSSH's own `sftp-server` as a child over pipes (a real server without ssh), some
# through a proxy that clips its replies (`io-util`: the in-memory pipe and packet reads);
# timeout tests run on paused time (`test-util`), so a slow machine cannot reorder them.
tokio = { version = "1.54.1", features = ["process", "io-util", "test-util"] }

# macOS: the app menu's Quit item would end the process past the unsaved-changes prompt; sopen
# turns the default menu off and handles Cmd+Q itself.
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false }
# The F-key switch hears the Mac sleep, wake and switch sessions (NSWorkspace's notifications,
# `.prd/04-file-keys.md` §6.2). Already in the tree (eframe, egui-winit, rfd → objc2-app-kit
# 0.3), at these exact versions; only features nothing else enabled are new (`NSOperation`).
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSNotification",
    "NSOperation",
    "NSString",
] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
