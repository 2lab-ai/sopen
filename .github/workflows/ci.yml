name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # preview.yml and release.yml run this same gate before they publish anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS first because aarch64-apple-darwin is the platform that ships first.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The export tests encode real media (spec §7); the formula depends on ffmpeg the same way.
      # libasound2-dev: cpal (the media window's audio output) links ALSA; everything else the
      # window needs on Linux (X11, Wayland, EGL, Vulkan, fontconfig) is loaded at runtime.
      # zsh and fish: `--target` runs its command through the target's login shell (spec §4a);
      # the tests run it under each one.
      - name: Install ffmpeg, ALSA headers and login shells (Linux)
        if: runner.os == 'Linux'
        run: |
          # Through a list of Ubuntu mirrors, with retries and a timeout (the script says why);
          # its own test first. openssh-sftp-server: the SFTP listing test runs a real server.
          bash .github/scripts/tests/apt-install.test.sh
          bash .github/scripts/apt-install.sh ffmpeg libasound2-dev pkg-config zsh fish openssh-sftp-server

      - name: Install ffmpeg and fish (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg fish

      # Which ffmpeg the tests ran against (Ubuntu's and Homebrew's differ, and the stems' exact
      # length once depended on it), and how its decoder treats the AAC trims a file carries:
      # ffmpeg 9 applies an MP4 edit list's end and Matroska's CodecDelay, ffmpeg 8 leaves both to
      # the player (the render tests hold renders to a plain encode by the same ffmpeg for that
      # reason). The version print fails the step if ffmpeg is missing; the trims are a receipt.
      - name: ffmpeg version
        run: |
          ffmpeg -hide_banner -version | head -n 3
          ffprobe -hide_banner -version | head -n 1

      # The git panel's tests run the host's own git (`.prd/03-git-panel.md` §11); GitHub's
      # runners ship it. Which git they ran against, and the step fails if there is none.
      - name: git version
        run: git --version

      - name: ffmpeg's AAC trims
        continue-on-error: true
        run: |
          dir=$(mktemp -d)
          for ext in m4a mkv; do
            ffmpeg -hide_banner -loglevel error -f lavfi -i sine=f=440:r=48000 \
              -af atrim=end_sample=96000 -c:a aac "$dir/a.$ext"
            bytes=$(ffmpeg -hide_banner -loglevel error -i "$dir/a.$ext" -f s16le -ac 1 - | wc -c)
            echo "$ext: 96000 samples encoded, $((bytes / 2)) decoded;" \
              "$(ffprobe -v error -select_streams a:0 -of compact=p=0 \
                -show_entries stream=start_time,duration_ts,initial_padding "$dir/a.$ext")"
          done
          python3 - "$dir/a.m4a" "$dir/a.mkv" <<'EOF'
          import sys
          m4a = open(sys.argv[1], "rb").read()
          at = m4a.find(b"elst")
          print("m4a edit list:", m4a[at - 4:at + 24].hex())
          print("mkv CodecDelay:", b"\x56\xaa" in open(sys.argv[2], "rb").read()[:4096])
          EOF

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      # `sopen stems` (spec §7a): the separation tests run the real model on a ~10 s fixture.
      # It is not in the repo or the release assets (the formula installs it): downloaded once
      # into a cache keyed by its SHA-256, and checked on every run.
      - name: Restore the voice/music model
        id: stems-model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/stems-model
          key: stems-model-${{ runner.os }}-e411182ce2c53541fefdcc99a8f46f2fe03978eb22038b9497c1d9d95a00fad4

      - name: Download the voice/music model
        if: steps.stems-model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/stems-model"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/stems-model/UVR-MDX-NET-Voc_FT.onnx" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/UVR-MDX-NET-Voc_FT.onnx

      - name: Check the voice/music model
        shell: bash
        run: |
          sum="$(if command -v sha256sum > /dev/null; then sha256sum; else shasum -a 256; fi \
            < "$RUNNER_TEMP/stems-model/UVR-MDX-NET-Voc_FT.onnx" | cut -d' ' -f1)"
          [ "$sum" = e411182ce2c53541fefdcc99a8f46f2fe03978eb22038b9497c1d9d95a00fad4 ] ||
            { echo "::error::the voice/music model has SHA-256 $sum"; exit 1; }

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        env:
          # A missing ffmpeg fails the export tests here instead of skipping them, a missing zsh or
          # fish fails the login-shell lanes, and a missing node fails the KWin script's behaviour
          # test (node is preinstalled on GitHub's runners). A missing OpenSSH `sftp-server` fails the
          # SFTP listing test (a real server over pipes; macOS ships it, Linux installs it above).
          # A missing voice/music model fails the separation tests (downloaded above). A missing
          # git fails the git panel's tests.
          SOPEN_REQUIRE_FFMPEG: "1"
          SOPEN_REQUIRE_GIT: "1"
          SOPEN_REQUIRE_STEMS: "1"
          SOPEN_STEMS_MODEL: ${{ runner.temp }}/stems-model/UVR-MDX-NET-Voc_FT.onnx
          SOPEN_REQUIRE_SHELLS: "1"
          SOPEN_REQUIRE_NODE: "1"
          SOPEN_REQUIRE_SFTP_SERVER: "1"
        run: cargo test --locked

      # The Linux binary loads libasound and glibc's and GCC's own runtime at start: libc, libm,
      # libdl, libpthread, libgcc_s, and libstdc++ for sherpa-onnx / ONNX Runtime (`sopen stems`,
      # linked statically); X11, Wayland, EGL, Vulkan and fontconfig are opened at runtime. Prove
      # it on a clean system with just the ALSA runtime (the image has libstdc++6: apt needs it).
      # Same Ubuntu release as the runner (read from its /etc/os-release, so a new runner image
      # moves it too): the binary needs the build host's glibc or newer.
      - name: Runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          image="ubuntu:$(. /etc/os-release && echo "$VERSION_ID")"
          echo "clean system: $image"
          # The image's sources name archive.ubuntu.com and security.ubuntu.com: through the same
          # mirror list as on the runner (.github/scripts/apt-install.sh).
          docker run --rm -v "$PWD/target/release/sopen:/usr/local/bin/sopen:ro" \
            -v "$PWD/.github/scripts/apt-install.sh:/usr/local/bin/apt-install.sh:ro" \
            -e SOPEN_APT_QUIET=1 "$image" \
            bash -c 'bash /usr/local/bin/apt-install.sh libasound2t64 > /dev/null \
              && ldd /usr/local/bin/sopen && sopen --version'
