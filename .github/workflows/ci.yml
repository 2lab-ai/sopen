name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # preview.yml and release.yml run this same gate before they publish anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS first because aarch64-apple-darwin is the platform that ships first.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The export tests encode real media (spec §7); the formula depends on ffmpeg the same way.
      # libasound2-dev: cpal (the media window's audio output) links ALSA; everything else the
      # window needs on Linux (X11, Wayland, EGL, Vulkan, fontconfig) is loaded at runtime.
      # zsh and fish: `--target` runs its command through the target's login shell (spec §4a);
      # the tests run it under each one.
      - name: Install ffmpeg, ALSA headers and login shells (Linux)
        if: runner.os == 'Linux'
        run: |
          # archive.ubuntu.com and security.ubuntu.com, and the runner's own mirror list (which falls
          # back to them), time out at times; azure.archive.ubuntu.com carries the same suites,
          # security included. ports.ubuntu.com (the arm64 runners) is left as it is. Retries and a
          # per-request timeout turn a stalled request into a retry instead of a hung job.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then
              sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors\.txt|https?://([a-z0-9-]+\.)*(archive|security)\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#g' "$f"
            fi
          done
          apt=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30)
          sudo apt-get "${apt[@]}" update
          sudo apt-get "${apt[@]}" install -y ffmpeg libasound2-dev pkg-config zsh fish

      - name: Install ffmpeg and fish (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg fish

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        env:
          # A missing ffmpeg fails the export tests here instead of skipping them, a missing zsh or
          # fish fails the login-shell lanes, and a missing node fails the KWin script's behaviour
          # test (node is preinstalled on GitHub's runners).
          SOPEN_REQUIRE_FFMPEG: "1"
          SOPEN_REQUIRE_SHELLS: "1"
          SOPEN_REQUIRE_NODE: "1"
        run: cargo test --locked

      # The Linux binary loads only libasound and libc at start (X11, Wayland, EGL, Vulkan and
      # fontconfig are opened at runtime): prove it on a clean system with just the ALSA runtime.
      # Same Ubuntu release as the runner (read from its /etc/os-release, so a new runner image
      # moves it too): the binary needs the build host's glibc or newer.
      - name: Runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          image="ubuntu:$(. /etc/os-release && echo "$VERSION_ID")"
          echo "clean system: $image"
          # The image's sources name archive.ubuntu.com and security.ubuntu.com: pointed at the
          # Azure mirror first, as on the runner (see "Install ffmpeg, ALSA headers…").
          docker run --rm -v "$PWD/target/release/sopen:/usr/local/bin/sopen:ro" "$image" \
            bash -c 'for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do \
                if [ -f "$f" ]; then \
                  sed -i -E "s#https?://([a-z0-9-]+\.)*(archive|security)\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#g" "$f"; \
                fi; \
              done \
              && apt=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30) \
              && apt-get "${apt[@]}" update -qq \
              && apt-get "${apt[@]}" install -y -qq libasound2t64 > /dev/null \
              && ldd /usr/local/bin/sopen && sopen --version'
