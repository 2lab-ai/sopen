name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # preview.yml and release.yml run this same gate before they publish anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS first because aarch64-apple-darwin is the platform that ships first.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The export tests encode real media (spec §7); the formula depends on ffmpeg the same way.
      # libasound2-dev: cpal (the media window's audio output) links ALSA; everything else the
      # window needs on Linux (X11, Wayland, EGL, Vulkan, fontconfig) is loaded at runtime.
      # zsh and fish: `--target` runs its command through the target's login shell (spec §4a);
      # the tests run it under each one.
      - name: Install ffmpeg, ALSA headers and login shells (Linux)
        if: runner.os == 'Linux'
        run: |
          # Through a list of Ubuntu mirrors, with retries and a timeout (the script says why);
          # its own test first. openssh-sftp-server: the SFTP listing test runs a real server.
          bash .github/scripts/tests/apt-install.test.sh
          bash .github/scripts/apt-install.sh ffmpeg libasound2-dev pkg-config zsh fish openssh-sftp-server

      - name: Install ffmpeg and fish (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg fish

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        env:
          # A missing ffmpeg fails the export tests here instead of skipping them, a missing zsh or
          # fish fails the login-shell lanes, and a missing node fails the KWin script's behaviour
          # test (node is preinstalled on GitHub's runners). A missing OpenSSH `sftp-server` fails the
          # SFTP listing test (a real server over pipes; macOS ships it, Linux installs it above).
          SOPEN_REQUIRE_FFMPEG: "1"
          SOPEN_REQUIRE_SHELLS: "1"
          SOPEN_REQUIRE_NODE: "1"
          SOPEN_REQUIRE_SFTP_SERVER: "1"
        run: cargo test --locked

      # The Linux binary loads only libasound and libc at start (X11, Wayland, EGL, Vulkan and
      # fontconfig are opened at runtime): prove it on a clean system with just the ALSA runtime.
      # Same Ubuntu release as the runner (read from its /etc/os-release, so a new runner image
      # moves it too): the binary needs the build host's glibc or newer.
      - name: Runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          image="ubuntu:$(. /etc/os-release && echo "$VERSION_ID")"
          echo "clean system: $image"
          # The image's sources name archive.ubuntu.com and security.ubuntu.com: through the same
          # mirror list as on the runner (.github/scripts/apt-install.sh).
          docker run --rm -v "$PWD/target/release/sopen:/usr/local/bin/sopen:ro" \
            -v "$PWD/.github/scripts/apt-install.sh:/usr/local/bin/apt-install.sh:ro" \
            -e SOPEN_APT_QUIET=1 "$image" \
            bash -c 'bash /usr/local/bin/apt-install.sh libasound2t64 > /dev/null \
              && ldd /usr/local/bin/sopen && sopen --version'
