name: Release

# Stable release on tag v*. The tag must match Cargo.toml's version
# (AGENTS.md §Distribution). After the release is published, Formula/sopen.rb
# is rendered from packaging/homebrew/sopen.rb.tmpl and pushed to the tap
# (when TAP_DISPATCH_TOKEN is set; otherwise the job says so and the formula
# is pushed by hand — AGENTS.md §Distribution).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The same gate as ci.yml: a red commit is never released, even when tagged.
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: sopen-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: sopen-macos-x86_64
          # Linux binaries link the runner's glibc: build on 22.04 (glibc 2.35) so they
          # also run on older distributions than the newest runner image.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: sopen-linux-x86_64
          # Native arm64 runner (free for public repos) — no cross/zigbuild needed.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            name: sopen-linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # `sopen --version` = `sopen <ver> (<channel> <sha12>)` (src/lib.rs version_text).
      SOPEN_BUILD_CHANNEL: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      # SOPEN_BUILD_ID is a revision: version_text keeps its first 12 chars, so it
      # must start with the commit sha (a `<tag>-<sha12>` id would print the tag).
      - name: Set build id
        shell: bash
        run: echo "SOPEN_BUILD_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # cpal (the media window's audio output) links ALSA; X11, Wayland, EGL, Vulkan and
      # fontconfig are loaded at runtime and need no headers. Both Linux runners (x86_64, arm64).
      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: |
          # archive.ubuntu.com and security.ubuntu.com, and the runner's own mirror list (which falls
          # back to them), time out at times; azure.archive.ubuntu.com carries the same suites,
          # security included. ports.ubuntu.com (the arm64 runners) is left as it is. Retries and a
          # per-request timeout turn a stalled request into a retry instead of a hung job.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then
              sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors\.txt|https?://([a-z0-9-]+\.)*(archive|security)\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#g' "$f"
            fi
          done
          apt=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30)
          sudo apt-get "${apt[@]}" update
          sudo apt-get "${apt[@]}" install -y libasound2-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/sopen" "${{ matrix.name }}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          else
            shasum -a 256 "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  # Hermetic regression test of the tap bump (mocked gh, local git remote).
  tap-bump-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Regression-test the tap bump script
        run: .github/scripts/tests/bump-tap.test.sh

  release:
    needs: [gate, build, tap-bump-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for asset in sopen-macos-aarch64 sopen-macos-x86_64 sopen-linux-x86_64 sopen-linux-aarch64; do
            cp "artifacts/$asset/$asset" "release/$asset"
          done
          (cd release && sha256sum sopen-* > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # GitHub prepends `body` to the generated notes.
          body: "Install: `brew install 2lab-ai/tap/sopen`"
          generate_release_notes: true
          files: |
            release/sopen-macos-aarch64
            release/sopen-macos-x86_64
            release/sopen-linux-x86_64
            release/sopen-linux-aarch64
            release/SHA256SUMS

  # The tap credential is used only in this job, and only by the bump step.
  tap-bump:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Presence only, at job level: a step's own `env` is not visible to its
      # `if:`, and `secrets` cannot appear in `if:` at all.
      HAS_TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The same build artifacts the release job attached, so the rendered
      # sha256s are the ones brew will download.
      - name: Download the released binaries
        if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: sopen-*
          merge-multiple: true
          path: release

      - name: Tap bump skipped (no TAP_DISPATCH_TOKEN)
        if: env.HAS_TAP_TOKEN == 'false'
        run: echo "::notice::TAP_DISPATCH_TOKEN is not set; 2lab-ai/homebrew-tap Formula/sopen.rb was not bumped to ${{ github.ref_name }} — push the rendered formula by hand (AGENTS.md §Distribution)"

      - name: Bump Homebrew tap to this release
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          # Consumed by `gh auth setup-git`, never placed in a remote URL.
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          FORMULA: sopen
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: release
        run: .github/scripts/bump-tap.sh
